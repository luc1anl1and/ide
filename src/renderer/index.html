<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reva</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="terminal.css">
<link rel="stylesheet" href="browser.css">
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="tb-left">
      <div class="brand"><span class="lg" id="brand-logo"></span><span id="brand-name">Reva</span></div>
      <button class="pill" id="btn-ws" title="Workspace"></button>
    </div>
    <div class="tb-mid"><div class="tb-combos" id="tb-combos"></div></div>
    <div class="tb-right">
      <button class="usage-btn" id="btn-usage" title="Usage"></button>
      <button class="pill" id="btn-user" title="Account"></button>
      <button class="icon-btn" id="btn-browser" title="Browser preview (Ctrl+Shift+B)"></button>
      <button class="icon-btn" id="btn-palette" title="Command palette (Ctrl+Shift+P)"></button>
      <button class="icon-btn" id="btn-toggle-term" title="Terminal (Ctrl+`)"></button>
      <button class="icon-btn" id="btn-focus" title="Focus chat"></button>
      <button class="icon-btn" id="btn-toggle-chat" title="Chat panel (Ctrl+J)"></button>
      <button class="icon-btn" id="btn-settings" title="Settings (Ctrl+,)"></button>
    </div>
  </header>

  <div id="main">
    <aside id="sidebar"></aside>
    <div class="resizer v" id="rz-side"></div>
    <section id="center">
      <div id="editor-card">
        <div id="editor-tabs"></div>
        <div id="editor-area">
          <div id="monaco"></div>
          <div id="viewer" class="hidden"></div>
          <div id="browser-host" class="hidden"></div>
          <div id="diff-host" class="hidden"></div>
          <div id="welcome"></div>
        </div>
      </div>
      <div class="resizer h" id="rz-term"></div>
      <div id="terminal" class="hidden"></div>
    </section>
    <div class="resizer v" id="rz-chat"></div>
    <section id="chat"></section>
    <div class="resizer v" id="rz-side2"></div>
    <aside id="sidebar2"></aside>
  </div>

  <footer id="statusbar"></footer>
</div>
<div id="overlay-root"></div>
<div id="toasts"></div>

<script src="../../node_modules/marked/lib/marked.umd.js"></script>
<script src="../../node_modules/dompurify/dist/purify.min.js"></script>
<script src="themes.js"></script>
<script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
<script src="../../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
<script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
<script src="../../node_modules/monaco-editor/min/vs/loader.js"></script>
<script src="util.js"></script>
<script src="claude-mark.js"></script>
<script src="logos.js"></script>
<script src="combo.js"></script>
<script src="tabscroll.js"></script>
<script src="keys.js"></script>
<script src="controls.js"></script>
<script src="colorpicker.js"></script>
<script src="theme-editor.js"></script>
<script src="terminal.js"></script>
<script src="browser.js"></script>
<script src="providers.js"></script>
<script src="media.js"></script>
<script src="chat.js"></script>
<script src="panels.js"></script>
<script src="settings.js"></script>
<script src="settings-ui.js"></script>
<script src="plugins.js"></script>
<script src="plugins-ui.js"></script>
<script src="preview-tools.js"></script>
<script src="pet-bridge.js"></script>
<script src="popout.js"></script>
<script src="app.js"></script>
</body>
</html>
